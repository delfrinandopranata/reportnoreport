name: CI v2
on:
  pull_request:
    paths: ['v2/**', '.github/workflows/ci-v2.yml']
  push:
    branches: [main]
    paths: ['v2/**', '.github/workflows/ci-v2.yml']
permissions: { contents: read }
defaults:
  run: { working-directory: v2 }
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: v2/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env: { VITE_SUPABASE_URL: http://127.0.0.1:54321, VITE_SUPABASE_ANON_KEY: ci.e30.ci }
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      # Without this, v2/package.json makes Deno expect node_modules; the functions don't use it.
      - run: deno test supabase/functions
        env: { DENO_NO_PACKAGE_JSON: "1" }
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.120.0 }
      - run: supabase db start
      - run: supabase test db

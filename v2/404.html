<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — ReportNoReport</title>
    <meta name="description" content="This page is not here." />
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/site/site.css" />
    <script>
      (() => {
        // Public pages are always light; the accent follows a signed-in person's choice. appearance.test.ts runs this.
        let s = {}
        try { s = JSON.parse(localStorage.getItem('rnr.appearance') || '{}') || {} } catch {}
        const h = document.documentElement
        if (h.classList) h.classList.add('js') // the fake document in appearance.test.ts has no classList
        h.dataset.theme = 'light'
        const q = typeof location === 'undefined' ? null : /[?&]accent=([a-z]+)/.exec(location.search)
        const ok = ['midnight', 'ocean', 'bw', 'graphite', 'fern', 'rosewood', 'iris', 'saffron']
        h.dataset.accent = ok.includes(q && q[1]) ? q[1] : ok.includes(s.accent) ? s.accent : 'midnight'
      })()
    </script>
    <script src="/consent.js" defer></script>
  </head>
  <body class="rnr">
    <header class="lp-bar">
      <a class="rnr-wordmark" href="/" data-draw aria-label="ReportNoReport home">Report<span>No</span><span class="rnr-wordmark-rr">R<svg class="rnr-strike" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20C8 14 14 8 22 3"/></svg></span>eport</a>
      <a class="rnr-btn rnr-btn-secondary" href="/app/">Sign in</a>
    </header>
    <main class="lp-main">
      <div class="rnr-folder lp-404">
        <span class="rnr-folder-tab">404</span>
        <div class="rnr-folder-body">
          <h1 class="lp-h1">This page is not here.</h1>
          <p class="rnr-muted">The address may be mistyped, or the page has moved.</p>
          <div class="lp-actions">
            <a class="rnr-btn rnr-btn-primary" href="/">Go to the home page</a>
            <a class="rnr-btn rnr-btn-secondary" href="/app/">Open the app</a>
          </div>
        </div>
      </div>
    </main>
    <footer class="lp-foot">
      <span>© 2026 ReportNoReport</span>
      <a href="/privacy">Privacy policy</a>
      <a href="/terms">Terms and conditions</a>
      <button type="button" class="rnr-btn rnr-btn-ghost" data-consent-settings>Cookie settings</button>
    </footer>
  </body>
</html>

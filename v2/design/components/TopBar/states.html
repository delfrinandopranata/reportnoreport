<div class="pv-row"><button class="rnr-dock rnr-paper rnr-paper--plain" type="button" data-open="j1" aria-haspopup="dialog">{{i:magnifying-glass}}<span>Go to a page</span><span class="rnr-kbd" aria-hidden="true">⌘ K</span></button></div>
<dialog class="rnr-dialog rnr-jump" id="j1" aria-label="Go to a page"><div class="rnr-jump-field"><span class="rnr-input-wrap">{{i:magnifying-glass}}<input class="rnr-input" role="combobox" aria-expanded="true" aria-controls="j1l" placeholder="Go to a page" autofocus></span></div>
  <ul class="rnr-jump-list" id="j1l" role="listbox"><li class="rnr-jump-option" role="option" aria-selected="true">{{i:tray}}Inbox</li><li class="rnr-jump-option" role="option" aria-selected="false">{{i:database}}Records</li><li class="rnr-jump-option" role="option" aria-selected="false">{{i:gear-six}}Settings</li></ul>
  <div class="rnr-dialog-foot"><span class="rnr-caption">Enter opens the page. Esc closes.</span></div></dialog>
<p class="pv-state">Press the dock (or ⌘K / Ctrl+K in the app). It lists the pages a person can open and filters by label; it does not search records. Focus returns to the dock on close.</p>

<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:var(--surface-000);font-family:var(--font-sans)}
.c{position:relative;width:960px;height:300px;overflow:hidden}
svg{position:absolute;left:0;top:0}
.ink{fill:var(--brand-solid)} .in{fill:var(--in)} .out{fill:var(--out)} .tint{fill:var(--surface-200)} .card{fill:var(--surface-100)}
.rx{rx:var(--radius-xl);ry:var(--radius-xl)} .pill{rx:22px;ry:22px}
.row{stroke:var(--brand-solid-ink);stroke-width:7;stroke-linecap:round;opacity:.55}
.beam{stroke:var(--lumen);stroke-width:5;stroke-linecap:round}
.t{position:absolute;left:48px;bottom:40px;right:48px}
.n{margin:0;font-size:64px;line-height:.95;font-weight:600;letter-spacing:-0.045em;color:var(--ink);white-space:nowrap}
.n span{color:var(--ink-faint)}
.g{margin:14px 0 0;font-size:14px;line-height:20px;color:var(--ink-muted);max-width:440px}
</style></head><body><div class="c">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<!-- blocks: brand-solid tile 136x136 (radius-xl), in 200x96, out 96x96, surface-200 168x96 with a surface-100 pill 136x44, brand-solid 120x96
     arrangement: top band of dashboard-like tiles bleeding off the top edge; the mark, enlarged, is the first tile
     pattern: a literal motif — the mark's two report lines crossed by one beam of light (lumen), drawn on the first tile
     steps & radii: gaps space-4 (16); radius-xl (20); pill = half of its 44px height -->
<rect class="ink rx" x="-16" y="-24" width="152" height="136"/>
<path class="row" d="M24 34h68M24 66h42"/>
<path class="beam" d="M18 96 110 4"/>
<rect class="in rx" x="152" y="-24" width="200" height="120"/>
<rect class="tint rx" x="368" y="-24" width="184" height="120"/>
<rect class="card pill" x="392" y="36" width="136" height="44"/>
<rect class="out rx" x="568" y="-24" width="96" height="120"/>
<rect class="ink rx" x="680" y="-24" width="120" height="96"/>
<rect class="tint rx" x="816" y="-24" width="168" height="72"/>
<rect class="in rx" x="816" y="64" width="64" height="32" style="opacity:.5"/>
</svg>
<div class="t"><p class="n">Report<span>No</span>Report v2</p><p class="g">Report without complicated reporting — forms, dashboards and reports for school admins and HR.</p></div>
</div></body></html>

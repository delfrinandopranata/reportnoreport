<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet"><style>body{margin:0} .wrap{padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start} .cap{margin:0 0 8px} </style></head><body class="rnr rnr-ground"><div class="wrap" style="display:block"><div class="rnr-card" style="max-width:560px;gap:16px"><div class="rnr-field"><span class="rnr-label">Theme</span><div class="rnr-seg" style="width:100%"><button aria-pressed="true"><svg class="rnr-ico" viewBox="0 0 24 24" aria-hidden="true"><circle class="fill" cx="12" cy="12" r="4"/><circle class="line" cx="12" cy="12" r="4"/><path class="line" d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg> Light</button><button aria-pressed="false"><svg class="rnr-ico" viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><path class="line" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg> Dark</button><button aria-pressed="false">B&amp;W</button><button aria-pressed="false">B&amp;W dark</button></div></div><div class="rnr-field"><span class="rnr-label">Accent</span><div style="display:flex;gap:10px"><button class="rnr-focus" aria-pressed="true" aria-label="Default" style="width:36px;height:36px;border-radius:9999px;border:0;cursor:pointer;background:var(--ink);box-shadow:0 0 0 2px var(--surface-100),0 0 0 4px var(--ink)"></button><button class="rnr-focus" aria-pressed="false" aria-label="Ocean" style="width:36px;height:36px;border-radius:9999px;border:0;cursor:pointer;background:var(--brand-ocean);box-shadow:inset 0 0 0 1px var(--line-200)"></button><button class="rnr-focus" aria-pressed="false" aria-label="Forest" style="width:36px;height:36px;border-radius:9999px;border:0;cursor:point

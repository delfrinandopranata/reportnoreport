<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0} .wrap{padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start} .cap{font-size:12px;line-height:16px;color:var(--ink-muted);margin:0 0 8px} </style></head><body class="rnr rnr-ground"><div class="wrap" style="display:block"><div class="rnr-card" style="max-width:520px;gap:14px">
<div><p class="rnr-label" style="margin:0 0 6px;font-weight:500">Theme</p><div class="rnr-seg" style="width:100%"><button aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10ZM12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg> Light</button><button aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg> Dark</button><button aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v12H3zM8 20h8M12 16v4"/></svg> System</button></div></div>
<div><p style="margin:0 0 6px;font-weight:500">Colour preset</p><div style="display:flex;gap:10px"><button aria-pressed="true" aria-label="Default" class="rnr-focus" style="width:40px;height:40px;border-radius:var(--radius-xl);border:0;box-shadow:0 0 0 2px var(--surface-100),0 0 0 4px var(--ink);background:var(--brand-solid);cursor:pointer"></button><button aria-pressed="false" aria-label="Ocean" class="rnr-focus" style="width:40px;height:40px;border-radius:var(--radius-xl);border:0;background:var(--brand-ocean);cursor:pointer"></button><button aria-pressed="false" aria-label="Forest" class="rnr-focus" style="width:40px;height:40px;border-radius:var(--radius-xl);border:0;background:var(--brand-forest);cursor:pointer"></button><button aria-pressed="false" aria-label="Sunset" class="rnr-focus" style="width:40px;height:40px;border-radius:var(--radius-xl);border:0;background:var(--brand-sunset);cursor:pointer"></button><button aria-pressed="false" class="rnr-btn rnr-btn-secondary" style="height:40px">Black &amp; White</button></div></div>
<div><p style="margin:0 0 6px;font-weight:500">Surface style</p><div class="rnr-seg" style="width:100%"><button aria-pressed="true">Solid</button><button aria-pressed="false">Glass</button><button aria-pressed="false">Neumorphic</button></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><p style="margin:0 0 6px;font-weight:500">Density</p><div class="rnr-seg" style="width:100%"><button aria-pressed="true">Comfortable</button><button aria-pressed="false">Compact</button></div></div><div><p style="margin:0 0 6px;font-weight:500">Motion</p><div class="rnr-seg" style="width:100%"><button aria-pressed="true">Full</button><button aria-pressed="false">Flat</button></div></div></div>
</div></div></body></html>
